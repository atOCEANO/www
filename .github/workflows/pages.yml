name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: the page is filled in from GitHub
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.fill.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - name: fill in the page from GitHub
        id: fill
        run: python3 .github/fill.py
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.fill.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: the page goes live
    needs: [build]
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
